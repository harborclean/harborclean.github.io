<title>Harbor Clean</title>
<meta name="description" content="Harbor Clean – clean up folders, shrink photos and strip photo location data on your Android phone.">
<style>
  :root { --brand: #1B4066; --brand-end: #0F2238; --link: #1557CC; --text: #0F1B2D; --muted: #5B6B80; --bg: #F6F8FB; }

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);

  main { text-align: center; max-width: 440px; }
  .logo { width: 96px; height: 96px; border-radius: 24px; margin: 0 auto 20px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--brand), var(--brand-end)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p { margin: 0 0 24px; color: var(--muted); }
  a { color: var(--link); font-weight: 600; }
  nav { display: flex; gap: 20px; justify-content: center; font-size: 15px; }
</style>
